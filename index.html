<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>CRM Videos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <main class="main">
        <div class="cards-grid">

            <!-- Salesforce Card -->
            <div class="card">
                <div class="card-window-header">
                    <div class="window-dots">
                        <span class="dot dot-red"></span>
                        <span class="dot dot-yellow"></span>
                        <span class="dot dot-green"></span>
                    </div>
                    <div class="window-title">Salesforce Integration</div>
                </div>

                <div class="card-video-wrapper">
                    <video src="salesforce.mp4" autoplay loop muted playsinline data-fullscreen-video
                        class="card-video card-video-salesforce"></video>
                </div>

                <div class="card-footer">
                    <div class="card-footer-content">
                        <div class="card-icon card-icon-blue">
                            <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
                                <path
                                    d="M16.1 16.3c-1.1 1.7-2.7 2.9-4.6 3.4-2.2.6-4.4.2-6.3-1.1-1.8-1.2-2.9-3-3.2-5.1-.3-2.3.5-4.4 2.1-6 1.4-1.4 3.3-2.2 5.3-2.2.5 0 1 .1 1.4.2.4-1.3 1.3-2.4 2.5-3.1 1.4-.8 3-.9 4.5-.3 1.6.6 2.8 1.9 3.4 3.5.9.1 1.8.5 2.5 1.1 1.3 1.1 2 2.7 1.9 4.4-.1 2.5-1.8 4.6-4.1 5.1-.3.1-.6.1-.9.1h-4.5z" />
                            </svg>
                        </div>
                        <h3 class="card-title">Salesforce</h3>
                    </div>
                </div>
            </div>

            <!-- HubSpot Card -->
            <div class="card">
                <div class="card-window-header">
                    <div class="window-dots">
                        <span class="dot dot-red"></span>
                        <span class="dot dot-yellow"></span>
                        <span class="dot dot-green"></span>
                    </div>
                    <div class="window-title">HubSpot Integration</div>
                </div>

                <div class="card-video-wrapper">
                    <video src="hubspot.mp4" autoplay loop muted playsinline data-fullscreen-video
                        class="card-video card-video-hubspot"></video>
                </div>

                <div class="card-footer">
                    <div class="card-footer-content">
                        <div class="card-icon card-icon-orange">
                            <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
                                <path
                                    d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z" />
                            </svg>
                        </div>
                        <h3 class="card-title">HubSpot</h3>
                    </div>
                </div>
            </div>

        </div>
    </main>


    <!-- ⭐ FULLSCREEN JS -->
    <script>
        document.querySelectorAll("[data-fullscreen-video]").forEach(video => {
            video.addEventListener("click", () => {
                if (video.requestFullscreen) video.requestFullscreen();
                else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
            });
        });
    </script>

</body>

</html>
